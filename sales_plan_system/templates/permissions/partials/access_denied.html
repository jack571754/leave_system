<div class="fixed inset-x-0 top-0 z-50 flex justify-center pt-4 pointer-events-none">
  <div class="pointer-events-auto max-w-md w-full rounded-2xl bg-red-50 border border-red-200 px-4 py-3 shadow-lg ring-1 ring-red-100">
    <div class="flex items-start gap-3">
      <svg class="h-5 w-5 shrink-0 text-red-500 mt-0.5" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.28 7.22a.75.75 0 00-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 101.06 1.06L10 11.06l1.72 1.72a.75.75 0 101.06-1.06L11.06 10l1.72-1.72a.75.75 0 00-1.06-1.06L10 8.94 8.28 7.22z" clip-rule="evenodd"/>
      </svg>
      <div class="flex-1">
        <p class="text-sm font-medium text-red-800">{{ message|default:"Access Denied" }}</p>
        <p class="mt-1 text-xs text-red-600">You do not have the required permission to perform this action.</p>
      </div>
      <button onclick="this.closest('.fixed').remove()" class="text-red-400 hover:text-red-600">
        <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
          <path d="M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z"/>
        </svg>
      </button>
    </div>
  </div>
</div>
